<script>
(function () {
  var roomMap = {
    'https://tour.panoee.net/6aab9760cfc0acdfb3e1cdc6/cr-1403': 'CR 14.03',
    'https://tour.panoee.net/6aab9760cfc0acdfb3e1cdc6/toilet': 'Women Toilet Eest',
    'https://tour.panoee.net/6aab9760cfc0acdfb3e1cdc6/huddle-room-1401': 'Huddle Room 14.01',
    'https://tour.panoee.net/6aab9760cfc0acdfb3e1cdc6/elevator-14': 'Elevator 14th',
    'https://tour.panoee.net/6aab9760cfc0acdfb3e1cdc6/cr-1402': 'CR 14.02',
    'https://tour.panoee.net/6aab9760cfc0acdfb3e1cdc6/collab': 'Collab Room',
    'https://tour.panoee.net/6aab9760cfc0acdfb3e1cdc6/fire-exit': 'Fire Exit 2',
    'https://tour.panoee.net/6aab9760cfc0acdfb3e1cdc6/printer': 'Printer'
  };

  function makeHoverCard(title, url) {
    var card = document.createElement('div');
    card.className = 'hover-card';
    card.innerHTML = [
      '<iframe src="' + url + '" title="' + title + ' tour" loading="lazy" allowfullscreen></iframe>',
      '<div>',
      '<h3>' + title + '</h3>',
      '<p>Interactive tour for ' + title + '.</p>',
      '<a class="card-cta" href="' + url + '">Open Tour →</a>',
      '</div>'
    ].join('');
    return card;
  }

  var anchors = document.querySelectorAll('a[href^="https://tour.panoee.net/"]');

  anchors.forEach(function (link) {
    var href = link.getAttribute('href');
    var title = roomMap[href] || link.getAttribute('alt') || link.getAttribute('title') || 'Room';

    var wrapper = document.createElement('span');
    wrapper.className = 'hover-target';

    if (link.parentNode && link.parentNode.classList && link.parentNode.classList.contains('hover-target')) {
      return;
    }

    link.parentNode.insertBefore(wrapper, link);
    wrapper.appendChild(link);
    wrapper.appendChild(makeHoverCard(title, href));
  });

  if ('ontouchstart' in window) {
    document.addEventListener('click', function (event) {
      var target = event.target;
      while (target && target !== document && !target.classList.contains('hover-target')) {
        target = target.parentNode;
      }

      if (!target || !target.classList || !target.classList.contains('hover-target')) {
        document.querySelectorAll('.hover-target.show').forEach(function (node) {
          node.classList.remove('show');
        });
        return;
      }

      var open = document.querySelectorAll('.hover-target.show');
      open.forEach(function (node) {
        if (node !== target) node.classList.remove('show');
      });

      target.classList.toggle('show');
      event.preventDefault();
      event.stopPropagation();
    }, false);
  }
})();
</script>
