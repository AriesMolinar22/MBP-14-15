<script>
// Enable tap-to-toggle for touch devices so the hover card is accessible on mobile
(function(){
  if (!('ontouchstart' in window)) return;
  document.addEventListener('click', function(e){
    var target = e.target;
    // find closest hover-target
    while(target && !target.classList) target = target.parentNode;
    if(!target) return;
    if(target.classList.contains('hover-target')) {
      // toggle
      if(target.classList.contains('show')){
        target.classList.remove('show');
        var card = target.querySelector('.hover-card'); if(card) card.setAttribute('aria-hidden','true');
      } else {
        // hide other open cards
        var open = document.querySelectorAll('.hover-target.show');
        open.forEach(function(o){ o.classList.remove('show'); var c=o.querySelector('.hover-card'); if(c) c.setAttribute('aria-hidden','true'); });
        target.classList.add('show');
        var card = target.querySelector('.hover-card'); if(card) card.setAttribute('aria-hidden','false');
      }
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    // click outside: close any open
    var open = document.querySelectorAll('.hover-target.show');
    open.forEach(function(o){ o.classList.remove('show'); var c=o.querySelector('.hover-card'); if(c) c.setAttribute('aria-hidden','true'); });
  }, false);
})();
</script>
